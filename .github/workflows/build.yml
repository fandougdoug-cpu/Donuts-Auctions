name: Build DonutsAuctions

on:
  push:
    branches: ["main", "gpt/26.2-port"]
  pull_request:
    branches: ["main"]

concurrency:
  group: donutsauctions-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests and build mod
        run: ./gradlew test build --no-daemon
